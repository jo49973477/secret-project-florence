# @package _global_
# Full UniVTAC dataset: no expected_episode_ids and no five-episode overrides.
defaults:
- /model: gr00t_sidecar
- /data: univtac_multimodal
- /training: finetune
- /hardware: quad_3090_zero3
- _self_
name: florence-full
run_id: ${now:%Y%m%d_%H%M%S}
output_dir: outputs/${name}/${run_id}
dry_run: false
resume:
  enabled: false
  checkpoint_path: null
  auto_find_latest: false
hydra:
  job:
    chdir: false
  run:
    dir: .
  output_subdir: null
temporal:
  window_size: 0
dit_training:
  mode: frozen
  rank: 16
  alpha: 32
  dropout: 0.0
model:
  tactile_fusion_mode: none
  contact_prediction_loss_weight: 0.0
  contact_predictor_warmup: false
  contact_injection_enabled: false
  freeze_contact_teacher: false
  contact_input_mode: none
  point_encoder_checkpoint_path: ${oc.env:FLORENCE_CONCERTO_CHECKPOINT,null}
  tune_diffusion_model: false
  freeze_pretrained_dit: true
  tune_multimodal_adapter: true
  state_dropout_prob: 0.0
  action_head_dropout_override: 0.0
  vl_self_attention_dropout_override: 0.0
training:
  max_steps: 10000
  wandb_project: Florence
  wandb_group: sidecar-ablation-full
  action_head_learning_rate: 0.0001
  dit_learning_rate: 0.00001
  gradient_accumulation_steps: 8
hardware:
  global_batch_size: 4
  gradient_accumulation_steps: 8
  gradient_checkpointing: true
